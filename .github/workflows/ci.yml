name: CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native tests with sanitizers
        run: >-
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined
          -fno-omit-frame-pointer -Isrc -Isrc/third_party/yyjson
          test/native/pluviora_core_test.cpp src/pluviora.cpp
          src/yyjson_bridge.cpp -o /tmp/pluviora_core_test
      - name: Run native tests
        run: >-
          /tmp/pluviora_core_test test/fixtures/basic.json test/fixtures/basic.js
          files/resources/runtime/font.ttf

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - run: dart pub publish --dry-run
      - name: Build Android release APK
        working-directory: example
        run: flutter build apk --release
      - name: Verify Android native runtime linkage
        working-directory: example
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            library=/tmp/libpluviora-${abi}.so
            unzip -p "$apk" "lib/${abi}/libpluviora.so" > "$library"
            test -s "$library"
            if ! readelf -d "$library" | grep -q 'Shared library: \[libm.so\]'; then
              echo "libpluviora.so is not linked against libm.so for ${abi}"
              exit 1
            fi
            if readelf -d "$library" | grep -q 'libc++_shared.so'; then
              echo "libpluviora.so still depends on libc++_shared.so for ${abi}"
              exit 1
            fi
          done

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify painter golden
        run: flutter test test/pluviora_golden_test.dart
      - name: Build unsigned iOS release
        working-directory: example
        run: flutter build ios --release --no-codesign
