name: pluviora
description: A Flutter Cross-Platform Library for Special File Previewing
version: 0.4.1
repository: https://github.com/jiangyin14/Pluviora
issue_tracker: https://github.com/jiangyin14/Pluviora/issues

topics:
  - flutter
  - ffi
  - file-preview
  - native-assets
  - cross-platform

platforms:
  android:
  ios:

environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_avif: ^3.1.0
  flutter_soloud: ^4.1.6
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.2

dev_dependencies:
  ffigen: ^21.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.28.0

flutter:
  assets:
    - files/resources/runtime/font.ttf
    - files/resources/runtime/track_anchor.png
    - files/resources/runtime/pause.png
    - files/resources/runtime/notes/
    - files/resources/runtime/sounds/
  shaders:
    - shaders/hit_ring.frag
